<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DreamMax Remote">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>DreamMax Remote</title>
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="apple-touch-icon" href="/remote-dreammax/icons/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            transition: background 0.3s;
        }
        
        .status-indicator.connected {
            background: #2ed573;
        }
        
        .settings-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            width: 35px;
            height: 35px;
            padding: 0;
        }
        
        .container {
            padding: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        /* SCAN MODE STYLES */
        .scan-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.98);
            z-index: 2000;
            animation: fadeIn 0.3s;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        
        .scan-modal.active {
            display: flex;
        }
        
        .scan-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .scan-icon {
            font-size: 4rem;
            color: #3498db;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        
        .scan-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .scan-subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
        }
        
        .scan-progress {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .scan-status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #3498db;
        }
        
        .scan-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .scan-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ed573);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        
        .scan-results {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
        }
        
        .scan-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(52, 152, 219, 0.2);
            border-radius: 6px;
            border-left: 3px solid #3498db;
        }
        
        .scan-result-item:last-child {
            margin-bottom: 0;
        }
        
        .scan-result-ip {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }
        
        .scan-result-status {
            font-size: 0.8rem;
            color: #2ed573;
        }
        
        .scan-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(145deg, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .scan-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .skip-scan-btn {
            margin-top: 15px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: #888;
            padding: 10px 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .no-results {
            text-align: center;
            padding: 20px;
            color: #ff4757;
        }
        
        /* TOP ROW */
        .top-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .power-btn-small {
            width: 60px;
            height: 50px;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(231, 76, 60, 0.3);
        }
        
        .mute-btn {
            width: 60px;
            height: 50px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        
        /* NUMBER PAD */
        .number-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .number-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        
        /* VOL/CH ROW */
        .vol-ch-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            width: 100%;
            height: 45px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        
        .control-btn i {
            font-size: 1rem;
        }
        
        /* HOME ROW */
        .home-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .home-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(145deg, #16a085, #1abc9c);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(22, 160, 133, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* D-PAD */
        .d-pad-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .d-pad {
            width: 160px;
            height: 160px;
            background: linear-gradient(145deg, #7f8c8d, #95a5a6);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        
        .d-pad-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: #2c3e50;
            font-size: 1.2rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .d-pad-btn:active {
            background: rgba(0,0,0,0.1);
        }
        
        .d-pad-up { top: 5px; left: 50%; transform: translateX(-50%); }
        .d-pad-down { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .d-pad-left { left: 5px; top: 50%; transform: translateY(-50%); }
        .d-pad-right { right: 5px; top: 50%; transform: translateY(-50%); }
        
        .d-pad-ok {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 50%;
            border: 3px solid #7f8c8d;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        /* INFO ROW */
        .info-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        /* COLOR BUTTONS */
        .color-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .color-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        
        .color-btn i {
            font-size: 1.2rem;
        }
        
        .color-btn span {
            font-size: 0.65rem;
        }
        
        .btn-red { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .btn-green { background: linear-gradient(145deg, #27ae60, #1e8449); }
        .btn-yellow { background: linear-gradient(145deg, #f39c12, #d68910); }
        .btn-blue { background: linear-gradient(145deg, #3498db, #2980b9); }
        
        /* FAV ROW */
        .fav-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .fav-btn {
            width: 100%;
            height: 40px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        
        .fav-btn i {
            font-size: 0.9rem;
        }
        
        /* F ROW */
        .f-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .f-btn {
            width: 100%;
            height: 38px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        /* MEDIA ROW */
        .media-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .media-btn {
            width: 100%;
            height: 40px;
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* LOGO */
        .logo {
            text-align: center;
            margin: 20px 0 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        
        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
        }
        
        .logo-text span {
            color: #3498db;
        }
        
        /* SETTINGS MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-header h2 {
            font-size: 1.3rem;
        }
        
        .close-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            padding: 0;
            box-shadow: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .checkbox-group input {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-test {
            background: linear-gradient(145deg, #3498db, #2980b9);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .btn-save {
            background: linear-gradient(145deg, #2ed573, #26c063);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(46, 213, 115, 0.3);
            padding: 12px 24px;
        }
        
        .btn-clear {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(231, 76, 60, 0.3);
            padding: 12px 24px;
        }
        
        /* TOAST MESSAGE */
        .message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 1001;
            transition: transform 0.3s;
        }
        
        .message.show {
            transform: translateX(-50%) translateY(0);
        }
        
        .message.error {
            background: rgba(231, 76, 60, 0.9);
        }
        
        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* BUTTON ACTIVE STATES */
        .power-btn-small:active,
        .mute-btn:active,
        .number-btn:active,
        .control-btn:active,
        .home-btn:active,
        .color-btn:active,
        .fav-btn:active,
        .f-btn:active,
        .media-btn:active,
        .d-pad-btn:active,
        .d-pad-ok:active,
        .scan-btn:active,
        .skip-scan-btn:active {
            transform: scale(0.92);
            filter: brightness(1.2);
            transition: all 0.1s ease;
        }
        
        /* Add pressed class for JavaScript feedback */
        .pressed {
            transform: scale(0.92) !important;
            filter: brightness(1.3) !important;
        }
    </style>
</head>
<body>
   <!-- WELCOME MODAL -->
    <div class="modal" id="welcomeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-satellite-dish"></i> Welcome!</h2>
            </div>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fas fa-remote" style="font-size: 4rem; color: #3498db; margin-bottom: 15px;"></i>
                <p style="color: #aaa; line-height: 1.6;">
                    This app controls your DreamMax B9S2X receiver remotely.<br>
                    <strong style="color: #fff;">Your receiver must be on the same Wi-Fi network as this device.</strong>
                </p>
            </div>
            
            <div class="form-group">
                <label for="welcomeIP">Receiver IP Address</label>
                <input type="text" id="welcomeIP" placeholder="e.g., 192.168.0.100">
                <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">
                    <i class="fas fa-info-circle"></i> Find it in your receiver's network settings
                </div>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-test" onclick="skipWelcomeAndScan()">
                    <i class="fas fa-search"></i> Auto-Scan
                </button>
                <button class="btn-save" onclick="saveAndContinue()">
                    <i class="fas fa-arrow-right"></i> Continue
                </button>
            </div>
        </div>
    </div>
    
    <!-- SCAN MODE MODAL -->
    <div class="scan-modal" id="scanModal">
        <div class="scan-container">
            <div class="scan-icon">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <div class="scan-title">Finding Your DreamMax</div>
            <div class="scan-subtitle">Scanning network for receiver...</div>
            
            <div class="scan-progress">
                <div class="scan-status" id="scanStatus">Starting scan...</div>
                <div class="scan-bar">
                    <div class="scan-bar-fill" id="scanBar"></div>
                </div>
                <div style="font-size: 0.8rem; color: #666;" id="scanProgress">0/254</div>
            </div>
            
            <div class="scan-results" id="scanResults"></div>
            
            <button class="scan-btn" id="scanBtn" onclick="toggleScan()">
                <i class="fas fa-search"></i> Start Scan
            </button>
            
            <button class="skip-scan-btn" id="skipScanBtn" onclick="skipScan()" style="display: none;">
                <i class="fas fa-stop"></i> Stop Scan
            </button>
            
            <button class="skip-scan-btn" onclick="skipScan()">
                Skip - Enter IP Manually
            </button>
        </div>
    </div>
    
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-satellite-dish"></i> DreamMax B9S2X</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="status-indicator" id="statusIndicator"></div>
            <button class="settings-btn" onclick="openSettings()">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </div>
    
    <div class="container">
        <!-- Top Row: Power + Mute -->
        <div class="top-row">
            <button class="power-btn-small" onclick="sendCommand(116)" data-command="116">
                <i class="fas fa-power-off"></i>
            </button>
            <button class="mute-btn" onclick="sendCommand(113)" data-command="113">
                <i class="fas fa-volume-mute"></i>
            </button>
        </div>
        
        <!-- Number Pad 1-9 -->
        <div class="number-pad">
            <button class="number-btn" onclick="sendNumber(1)" data-command="2">1</button>
            <button class="number-btn" onclick="sendNumber(2)" data-command="3">2</button>
            <button class="number-btn" onclick="sendNumber(3)" data-command="4">3</button>
            <button class="number-btn" onclick="sendNumber(4)" data-command="5">4</button>
            <button class="number-btn" onclick="sendNumber(5)" data-command="6">5</button>
            <button class="number-btn" onclick="sendNumber(6)" data-command="7">6</button>
            <button class="number-btn" onclick="sendNumber(7)" data-command="8">7</button>
            <button class="number-btn" onclick="sendNumber(8)" data-command="9">8</button>
            <button class="number-btn" onclick="sendNumber(9)" data-command="10">9</button>
        </div>
        
        <!-- Volume/Channel Row -->
        <div class="vol-ch-row">
            <button class="control-btn" onclick="sendCommand(115)" data-command="115">
                <i class="fas fa-volume-up"></i>
                <span>VOL+</span>
            </button>
            <button class="control-btn" onclick="sendNumber(0)" data-command="11">0</button>
            <button class="control-btn" onclick="sendCommand(178)" data-command="178">
                <i class="fas fa-chevron-up"></i>
                <span>CH+</span>
            </button>
            <button class="control-btn" onclick="sendCommand(114)" data-command="114">
                <i class="fas fa-volume-down"></i>
                <span>VOL-</span>
            </button>
            <button class="control-btn" onclick="sendCommand(509)" data-command="509">
                <span>SAT/Group</span>
            </button>
            <button class="control-btn" onclick="sendCommand(177)" data-command="177">
                <i class="fas fa-chevron-down"></i>
                <span>CH-</span>
            </button>
        </div>
        
        <!-- Home Row -->
        <div class="home-row">
            <button class="control-btn" onclick="sendCommand(139)" data-command="139">

    <!-- Toast Message -->

    <script defer>
        // STATE
        let receiverIP = localStorage.getItem('dreammax_ip') || '';
        let vibrationEnabled = localStorage.getItem('dreammax_vibration') === 'false' ? false : true;
        let skipScan = localStorage.getItem('dreammax_skip_scan') === 'true';
        let numberBuffer = '';
        let numberTimeout;
        let scanInProgress = false;
        let foundDevices = [];
        let debugMode = true; // Enable debug logging
        
        // CORS Bypass methods
        const CORS_METHODS = {
            DIRECT: 'direct',
            IMAGE_PING: 'image_ping',
            PROXY: 'proxy'
        };
        let currentCorsMethod = localStorage.getItem('dreammax_cors_method') || CORS_METHODS.DIRECT;
        
        // Public CORS proxies (fallback)
        const CORS_PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://cors-anywhere.herokuapp.com/'
        ];
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DreamMax Remote initialized');
            console.log('Receiver IP:', receiverIP);
            console.log('Skip scan:', skipScan);
            console.log('First time user:', !receiverIP);
            
            // Check if first time user
            const hasUsedBefore = localStorage.getItem('dreammax_has_used') === 'true';
            
            if (receiverIP && skipScan) {
                document.getElementById('receiverIP').value = receiverIP;
                checkConnection();
                registerServiceWorker();
            } else if (!receiverIP && !hasUsedBefore) {
                // First time user - show welcome modal
                setTimeout(() => {
                    document.getElementById('welcomeModal').classList.add('active');
                }, 500);
            } else if (!receiverIP || !skipScan) {
                // Show scan modal
                setTimeout(() => {
                    showScanModal();
                }, 500);
            }
            
            // Register service worker for offline support
            registerServiceWorker();
        });
        
        // Welcome modal functions
        function skipWelcomeAndScan() {
            document.getElementById('welcomeModal').classList.remove('active');
            showScanModal();
        }
        
        function saveAndContinue() {
            const ip = document.getElementById('welcomeIP').value.trim();
            if (ip) {
                const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (ipPattern.test(ip)) {
                    receiverIP = ip;
                    localStorage.setItem('dreammax_ip', ip);
                    localStorage.setItem('dreammax_has_used', 'true');
                    document.getElementById('welcomeModal').classList.remove('active');
                    document.getElementById('receiverIP').value = ip;
                    checkConnection();
                    if (document.getElementById('statusIndicator').classList.contains('connected')) {
                        showMessage('Connected successfully!', '');
                    } else {
                        showMessage('Connection failed - try auto-scan', 'error');
                        showScanModal();
                    }
                } else {
                    showMessage('Invalid IP address format!', 'error');
                }
            } else {
                showMessage('Please enter an IP address or use auto-scan', 'error');
            }
        }
        
        // ====================
        // SCAN FUNCTIONS
        // ====================
        
        function showScanModal() {
            document.getElementById('scanModal').classList.add('active');
            resetScanUI();
        }
        
        function toggleScan() {
            if (scanInProgress) {
                // Stop scan
                scanInProgress = false;
                document.getElementById('scanBtn').innerHTML = '<i class="fas fa-search"></i> Start Scan';
                document.getElementById('skipScanBtn').style.display = 'none';
                document.getElementById('scanStatus').textContent = 'Scan stopped';
            } else {
                // Start scan
                startScan();
            }
        }
        
        function skipScan() {
            scanInProgress = false;
            document.getElementById('scanModal').classList.remove('active');
            openSettings();
        }
        
        function resetScanUI() {
            document.getElementById('scanStatus').textContent = 'Ready to scan';
            document.getElementById('scanBar').style.width = '0%';
            document.getElementById('scanProgress').textContent = '0/1524';
            document.getElementById('scanResults').innerHTML = '';
            document.getElementById('scanBtn').innerHTML = '<i class="fas fa-search"></i> Start Scan';
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('skipScanBtn').style.display = 'none';
            foundDevices = [];
            scanInProgress = false;
        }
        
        async function startScan() {
            if (scanInProgress) return;
            
            scanInProgress = true;
            document.getElementById('scanBtn').innerHTML = '<i class="fas fa-pause"></i> Pause Scan';
            document.getElementById('skipScanBtn').style.display = 'block';
            document.getElementById('scanResults').innerHTML = '<div class="no-results">Scanning...</div>';
            
            // Scan multiple common network ranges
            const networkRanges = ['192.168.0', '192.168.1', '192.168.2', '192.168.100', '10.0.0', '10.1.1'];
            const totalIPs = networkRanges.length * 254;
            let scanned = 0;
            
            document.getElementById('scanStatus').textContent = `Scanning network ranges...`;
            
            // Scan each network range
            for (const networkRange of networkRanges) {
                if (!scanInProgress) break; // Allow cancellation
                
                document.getElementById('scanStatus').textContent = `Scanning ${networkRange}.x...`;
                
                // Scan IPs in parallel batches for this range
                const batch = async (start, end) => {
                    const promises = [];
                    
                    for (let i = start; i <= end; i++) {
                        const ip = `${networkRange}.${i}`;
                        const promise = testIP(ip).then(result => {
                            scanned++;
                            updateScanProgress(scanned, totalIPs);
                            
                            if (result) {
                                foundDevices.push(ip);
                                addScanResult(ip, 'Click to connect');
                            }
                        }).catch(() => {
                            scanned++;
                            updateScanProgress(scanned, totalIPs);
                        });
                        
                        promises.push(promise);
                        
                        // Limit parallel requests to avoid overwhelming
                        if (promises.length >= 15) {
                            await Promise.all(promises);
                            promises.length = 0;
                        }
                    }
                    
                    await Promise.all(promises);
                };
                
                // Scan this range in batches
                await batch(1, 85);
                await batch(86, 170);
                await batch(171, 254);
            }
            
            scanInProgress = false;
            document.getElementById('scanBtn').innerHTML = '<i class="fas fa-search"></i> Start Scan';
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('skipScanBtn').style.display = 'none';
            
            if (foundDevices.length > 0) {
                document.getElementById('scanStatus').textContent = `Found ${foundDevices.length} device(s)!`;
                document.getElementById('scanResults').innerHTML = '';
                
                foundDevices.forEach((ip, index) => {
                    addScanResult(ip, 'Click to connect', () => {
                        connectToDevice(ip);
                    });
                });
            } else {
                document.getElementById('scanStatus').textContent = 'No devices found';
                document.getElementById('scanResults').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <div>No DreamMax receiver found</div>
                        <div style="font-size: 0.8rem; margin-top: 10px; color: #888;">
                            Make sure the receiver is powered on and connected to the same Wi-Fi network
                        </div>
                    </div>
                `;
            }
        }
        
        async function detectNetworkRange() {
            const commonRanges = [
                '192.168.0',
                '192.168.1',
                '192.168.2',
                '192.168.100',
                '10.0.0',
                '10.1.1'
            ];
            
            // Try to detect from browser's network if possible
            try {
                const response = await fetch('https://ipapi.co/ip/');
                const data = await response.json();
                // Can't get local IP from external API, use common ranges
            } catch (e) {
                // Fall back to common ranges
            }
            
            // Return first common range, will scan multiple if needed
            return commonRanges[0];
        }
        
        async function testIP(ip) {
            // DreamMax/OpenWebif specific endpoints
            const endpoints = [
                '/web/info',
                '/api/info',
                '/web/webif',
                '/web/zap',
                '/web/remotecontrol',
                '/',
                '/cgi-bin/luci/',
                '/status'
            ];
            
            for (const endpoint of endpoints) {
                try {
                    // Use image ping method (bypasses CORS)
                    const result = await new Promise((resolve, reject) => {
                        const img = new Image();
                        const timeout = setTimeout(() => reject(new Error('Timeout')), 800);
                        
                        img.onload = () => {
                            clearTimeout(timeout);
                            resolve(true);
                        };
                        img.onerror = () => {
                            clearTimeout(timeout);
                            resolve(false);
                        };
                        
                        img.src = `http://${ip}${endpoint}?t=${Date.now()}`;
                    });
                    
                    if (result) {
                        if (debugMode) console.log('Found responsive device at:', ip, 'endpoint:', endpoint);
                        return true;
                    }
                    
                } catch (error) {
                    continue;
                }
            }
            
            return false;
        }
        
        function updateScanProgress(current, total) {
            const percentage = (current / total) * 100;
            document.getElementById('scanBar').style.width = `${percentage}%`;
            document.getElementById('scanProgress').textContent = `${current}/${total}`;
        }
        
        function addScanResult(ip, status, onClick = null) {
            const results = document.getElementById('scanResults');
            const item = document.createElement('div');
            item.className = 'scan-result-item';
            item.innerHTML = `
                <div class="scan-result-ip"><i class="fas fa-server"></i> ${ip}</div>
                <div class="scan-result-status">${status}</div>
            `;
            
            if (onClick) {
                item.style.cursor = 'pointer';
                item.onclick = onClick;
            }
            
            results.appendChild(item);
            results.scrollTop = results.scrollHeight;
        }
        
        function connectToDevice(ip) {
            receiverIP = ip;
            localStorage.setItem('dreammax_ip', ip);
            document.getElementById('scanModal').classList.remove('active');
            document.getElementById('receiverIP').value = ip;
            
            checkConnection();
            showMessage(`Connected to ${ip}!`, '');
        }
        
        // ====================
        // COMMAND SENDING WITH CORS BYPASS
        // ====================
        
        async function sendCommand(command) {
            if (debugMode) console.log('sendCommand called with:', command);
            
            if (!receiverIP) {
                showMessage('Please configure receiver IP first!', 'error');
                openSettings();
                return;
            }
            
            if (debugMode) console.log('Sending command', command, 'to', receiverIP);
            
            if (vibrationEnabled && navigator.vibrate) {
                navigator.vibrate(10);
            }
            
            const url = `http://${receiverIP}/web/remotecontrol?command=${command}`;
            
            if (debugMode) console.log('Request URL:', url);
            
            // Try different CORS bypass methods
            let success = false;
            
            // Method 1: Direct fetch (works if CORS is enabled on receiver)
            if (currentCorsMethod === CORS_METHODS.DIRECT) {
                try {
                    if (debugMode) console.log('Trying direct fetch...');
                    const response = await fetch(url, { method: 'GET', mode: 'cors' });
                    success = response.ok || response.status === 0;
                    if (debugMode) console.log('Direct fetch result:', success, response.status);
                } catch (error) {
                    if (debugMode) console.log('Direct fetch failed, trying image ping...');
                }
            }
            
            // Method 2: Image ping (always works - no CORS needed)
            if (!success) {
                try {
                    if (debugMode) console.log('Trying image ping...');
                    await new Promise((resolve, reject) => {
                        const img = new Image();
                        const timeout = setTimeout(() => reject(new Error('Timeout')), 3000);
                        
                        img.onload = () => {
                            clearTimeout(timeout);
                            if (debugMode) console.log('Image ping success!');
                            resolve();
                        };
                        img.onerror = () => {
                            clearTimeout(timeout);
                            if (debugMode) console.log('Image ping failed');
                            reject(new Error('Failed'));
                        };
                        
                        img.src = `${url}&t=${Date.now()}`;
                    });
                    success = true;
                } catch (error) {
                    if (debugMode) console.log('Image ping failed:', error);
                }
            }
            
            if (success) {
                updateStatus(true);
                if (vibrationEnabled && navigator.vibrate) {
                    navigator.vibrate([10, 50, 10]);
                }
                if (debugMode) console.log('Command sent successfully!');
            } else {
                updateStatus(false);
                showMessage('Command failed - check connection', 'error');
                if (debugMode) console.log('Command failed!');
            }
        }
        
        // Send number with buffer for quick channel entry
        function sendNumber(num) {
            if (debugMode) console.log('sendNumber called with:', num);
            
            if (!receiverIP) {
                showMessage('Please configure receiver IP first!', 'error');
                openSettings();
                return;
            }
            
            numberBuffer += num.toString();
            if (debugMode) console.log('Number buffer:', numberBuffer);
            
            if (numberTimeout) {
                clearTimeout(numberTimeout);
            }
            
            numberTimeout = setTimeout(() => {
                const channel = numberBuffer;
                numberBuffer = '';
                if (debugMode) console.log('Sending channel:', channel);
                sendChannel(channel);
            }, 300);
        }
        
        // Send channel number
        function sendChannel(channel) {
            if (vibrationEnabled && navigator.vibrate) {
                navigator.vibrate(10);
            }
            
            const url = `http://${receiverIP}/web/zap?chn=${channel}`;
            
            // Use image ping for CORS bypass
            const img = new Image();
            img.src = `${url}&t=${Date.now()}`;
            
            img.onload = () => {
                updateStatus(true);
            };
            
            img.onerror = () => {
                updateStatus(false);
            };
        }
        
        // Check connection to receiver
        async function checkConnection() {
            if (!receiverIP) return;
            
            try {
                // Use image ping for CORS bypass
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    const timeout = setTimeout(() => reject(new Error('Timeout')), 3000);
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        resolve();
                    };
                    img.onerror = () => {
                        clearTimeout(timeout);
                        reject(new Error('Failed'));
                    };
                    
                    img.src = `http://${receiverIP}/web/info?t=${Date.now()}`;
                });
                
                updateStatus(true);
            } catch (error) {
                updateStatus(false);
            }
        }
        
        // Test connection
        function testConnection() {
            let testIP = document.getElementById('receiverIP').value.trim();
            if (!testIP) {
                showMessage('Please enter IP address!', 'error');
                return;
            }
            
            const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (!ipPattern.test(testIP)) {
                showMessage('Invalid IP format!', 'error');
                return;
            }
            
            const originalIP = receiverIP;
            receiverIP = testIP;
            
            showMessage('Testing connection...', '');
            checkConnection().then(() => {
                const status = document.getElementById('statusIndicator').classList.contains('connected');
                if (status) {
                    showMessage('Connected successfully!', '');
                } else {
                    showMessage('Connection failed! Check IP.', 'error');
                    receiverIP = originalIP;
                    document.getElementById('receiverIP').value = originalIP || '';
                }
            });
        }
        
        // Update status indicator
        function updateStatus(connected) {
            const indicator = document.getElementById('statusIndicator');
            if (connected) {
                indicator.classList.add('connected');
            } else {
                indicator.classList.remove('connected');
            }
        }
        
        // Show message
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message show' + (type === 'error' ? ' error' : '');
            
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        }
        
        // Settings modal
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('receiverIP').value = receiverIP;
            document.getElementById('vibrationEnabled').checked = vibrationEnabled;
            document.getElementById('skipScanNextTime').checked = skipScan;
        }
        
        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }
        
        function saveSettings() {
            receiverIP = document.getElementById('receiverIP').value.trim();
            vibrationEnabled = document.getElementById('vibrationEnabled').checked;
            skipScan = document.getElementById('skipScanNextTime').checked;
            
            if (document.getElementById('rememberIP').checked) {
                localStorage.setItem('dreammax_ip', receiverIP);
                localStorage.setItem('dreammax_vibration', vibrationEnabled);
                localStorage.setItem('dreammax_skip_scan', skipScan);
            }
            
            if (receiverIP) {
                checkConnection();
                showMessage('Settings saved!', '');
            }
            
            closeSettings();
        }
        
        function clearSettings() {
            localStorage.removeItem('dreammax_ip');
            localStorage.removeItem('dreammax_vibration');
            localStorage.removeItem('dreammax_skip_scan');
            receiverIP = '';
            vibrationEnabled = true;
            skipScan = false;
            document.getElementById('receiverIP').value = '';
            document.getElementById('vibrationEnabled').checked = true;
            document.getElementById('rememberIP').checked = true;
            document.getElementById('skipScanNextTime').checked = false;
            updateStatus(false);
            showMessage('Settings cleared!', '');
        }
        
        // Service Worker registration
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            }
        }
        
        // Close modal on outside click
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target.id === 'settingsModal') {
                closeSettings();
            }
        });
        
        // Prevent zoom on double tap
        document.addEventListener('dblclick', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        // Add visual feedback to all buttons
        document.addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (button) {
                button.classList.add('pressed');
                setTimeout(() => button.classList.remove('pressed'), 150);
            }
        });
        
        // Log all button clicks for debugging
        document.addEventListener('click', (e) => {
            const button = e.target.closest('button');
